<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Huffman Encryption System</title>
  </head>

  <body class="min-h-screen bg-slate-950 text-white">
    <!-- Header -->
    <header class="border-b border-slate-800">
      <div class="max-w-6xl mx-auto px-6 py-6">
        <h1 class="text-3xl font-bold">Huffman Encryption System</h1>

        <p class="text-slate-400 mt-2">
          Compress, encode and decode messages using Huffman coding.
        </p>
      </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-6 py-10">
      <!-- Message Input -->
      <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-semibold">Enter Your Message</h2>

          <button
            id="pasteBtn"
            class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg font-semibold transition"
          >
            Paste
          </button>
        </div>

        <textarea
          id="messageInput"
          rows="6"
          placeholder="Type your message here..."
          class="w-full bg-slate-950 border border-slate-700 rounded-xl p-4 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500"
        ></textarea>

        <!-- Buttons -->
        <div class="flex gap-4 mt-5">
          <button
            id="encryptBtn"
            class="px-6 py-3 bg-blue-600 hover:bg-blue-700 rounded-xl font-semibold transition"
          >
            Encrypt
          </button>

          <button
            id="decryptBtn"
            class="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 rounded-xl font-semibold transition"
          >
            Decrypt
          </button>

          <button
            id="clearBtn"
            class="px-6 py-3 bg-slate-700 hover:bg-slate-600 rounded-xl font-semibold transition"
          >
            Clear
          </button>
        </div>
      </section>

      <!-- Output -->
      <section
        class="mt-8 bg-slate-900 border border-slate-800 rounded-2xl p-6"
      >
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-semibold">Output</h2>

          <button
            id="copyBtn"
            class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg font-semibold transition"
          >
            Copy
          </button>
        </div>

        <textarea
          id="output"
          rows="6"
          readonly
          class="w-full bg-slate-950 border border-slate-700 rounded-xl p-4 text-white resize-none"
          placeholder="Your encoded or decoded message will appear here..."
        ></textarea>
      </section>

      <!-- Compression Statistics -->
      <section
        class="mt-8 bg-slate-900 border border-slate-800 rounded-2xl p-6"
      >
        <h2 class="text-xl font-semibold mb-4">Compression Statistics</h2>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div class="bg-slate-950 border border-slate-700 rounded-xl p-4">
            <p class="text-slate-400 text-sm">Original Size</p>
            <p id="originalSize" class="text-xl font-bold mt-1">0 bits</p>
          </div>

          <div class="bg-slate-950 border border-slate-700 rounded-xl p-4">
            <p class="text-slate-400 text-sm">Compressed Size</p>
            <p id="compressedSize" class="text-xl font-bold mt-1">0 bits</p>
          </div>

          <div class="bg-slate-950 border border-slate-700 rounded-xl p-4">
            <p class="text-slate-400 text-sm">Compression Ratio</p>
            <p id="compressionRatio" class="text-xl font-bold mt-1">0%</p>
          </div>

          <div class="bg-slate-950 border border-slate-700 rounded-xl p-4">
            <p class="text-slate-400 text-sm">Space Saved</p>
            <p id="spaceSaved" class="text-xl font-bold mt-1">0%</p>
          </div>
        </div>
      </section>

      <!-- Huffman Codes -->
      <section
        class="mt-8 bg-slate-900 border border-slate-800 rounded-2xl p-6"
      >
        <h2 class="text-xl font-semibold mb-4">Huffman Codes</h2>

        <div class="overflow-x-auto">
          <table class="w-full text-left">
            <thead class="border-b border-slate-700 text-slate-400">
              <tr>
                <th class="py-3 px-4">Character</th>
                <th class="py-3 px-4">Frequency</th>
                <th class="py-3 px-4">Code</th>
              </tr>
            </thead>

            <tbody id="codeTable">
              <!-- Huffman codes will be inserted here later -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
